name: Update Cyber Intel & Deploy GitHub Pages

on:
  schedule:
    # Chạy tự động 2 lần mỗi ngày: 01:00 UTC (08:00 AM VN) & 13:00 UTC (20:00 PM VN)
    - cron: '0 1,13 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên giao diện GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml aiohttp

      - name: 🛡️ Collect Latest Security Intelligence Data
        run: |
          python .agents/skills/daily-security-digest/scripts/fetch_intel.py --output .agents/skills/daily-security-digest/cache/latest_intel.json

      - name: 🏗️ Build Static Site Bundle for GitHub Pages
        run: |
          python scripts/build_pages.py

      - name: 💾 Commit & Push Intelligence Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/daily-security-digest/cache/ reports/index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(intel): auto-update daily intelligence [skip ci]" && git push origin main)

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
